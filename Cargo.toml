[workspace]
members = [
    "crates/action",
    "crates/core",
    "crates/native-graph",
    "crates/python",
    "crates/topology",
    "crates/tokio-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
